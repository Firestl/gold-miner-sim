[project]
name = "gold-miner-sim"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Mack Bo", email = "ggstytt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.5.2",
    "pygame>=2.6.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
train = [
    "stable-baselines3[extra]",
]
